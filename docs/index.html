<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --color-void: #FAF8F5;
            --color-surface: #FFFFFF;
            --color-surface-elevated: #F7F6F3;
            --color-text-primary: #2D2D2D;
            --color-text-secondary: #6B6B6B;
            --color-text-tertiary: #9A9A9A;
            --color-border: #E8E4DF;
            --color-border-subtle: #F0EFEC;
            --color-accent: #7C9070;
            --color-recording: #C67D63;
            --color-processing: #D4A574;
            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--color-void);
            color: var(--color-text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Hero Section */
        .hero {
            padding: 80px 30px 60px;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.1s forwards;
        }

        .hero-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 32px;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.1s forwards;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(48px, 8vw, 72px);
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            color: var(--color-text-primary);
        }

        .hero-subtitle {
            font-family: var(--font-display);
            font-size: clamp(18px, 2.5vw, 24px);
            font-weight: 400;
            color: var(--color-text-secondary);
            margin-bottom: 32px;
            letter-spacing: -0.01em;
        }

        .hero-description {
            font-size: 16px;
            max-width: 560px;
            color: var(--color-text-secondary);
            line-height: 1.8;
            margin-bottom: 40px;
        }

        /* Version Badge */
        .version-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 100px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--color-text-secondary);
            margin-bottom: 60px;
        }

        .version-badge .dot {
            width: 6px;
            height: 6px;
            background: var(--color-accent);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        /* Features Section */
        .features {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 30px 60px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
        }

        .feature {
            padding: 24px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .feature:hover {
            border-color: var(--color-border);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            transform: translateY(-2px);
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-surface-elevated);
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 18px;
            color: var(--color-accent);
        }

        .feature-title {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-text-primary);
        }

        .feature-text {
            font-size: 14px;
            color: var(--color-text-secondary);
            line-height: 1.6;
        }

        /* Download Section */
        .download-section {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 30px 80px;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.4s forwards;
        }

        .download-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }

        .download-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .platform-icon {
            font-size: 32px;
            color: var(--color-text-primary);
        }

        .download-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .download-note {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin-top: 4px;
        }

        .download-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--color-surface-elevated);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            color: var(--color-text-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
            font-family: var(--font-body);
        }

        .download-btn:hover {
            background: var(--color-text-primary);
            border-color: var(--color-text-primary);
            color: var(--color-surface);
        }

        .download-btn .arrow {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--color-text-tertiary);
            transition: all 0.3s ease;
        }

        .download-btn:hover .arrow {
            color: var(--color-surface);
        }

        .download-btn[href="#"] {
            opacity: 0.4;
            pointer-events: none;
        }

        /* Requirements Section */
        .requirements {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 30px 60px;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.5s forwards;
        }

        .requirements-title {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-text-tertiary);
            margin-bottom: 16px;
        }

        .requirements-list {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        .requirement {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--color-text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .requirement-icon {
            color: var(--color-accent);
        }

        /* Footer */
        .footer {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 30px;
            border-top: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            align-items: center;
        }

        .footer-link {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-link:hover {
            color: var(--color-text-primary);
        }

        /* Language Switcher */
        .lang-switch {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: var(--color-surface-elevated);
            border: 1px solid var(--color-border);
            border-radius: 100px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-user-select: none;
            user-select: none;
        }

        .lang-switch:hover {
            border-color: var(--color-accent);
            color: var(--color-text-primary);
        }

        .lang-switch i {
            font-size: 11px;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero {
                padding: 60px 20px 40px;
            }

            .features {
                padding: 0 20px 40px;
                grid-template-columns: 1fr;
            }

            .download-section {
                padding: 0 20px 60px;
            }

            .download-card {
                padding: 24px;
            }

            .requirements {
                padding: 0 20px 40px;
            }

            .requirements-list {
                flex-direction: column;
                gap: 12px;
            }

            .footer {
                padding: 30px 20px;
                flex-direction: column;
                align-items: flex-start;
            }

            .footer-links {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

                    { icon: "fa-solid fa-sliders", title: "\u30e2\u30c7\u30eb\u9078\u629e", text: "50\u4ee5\u4e0a\u306e\u8a00\u8a9e\u3068\u81ea\u52d5\u8a00\u8a9e\u691c\u51fa\u306b\u5bfe\u5fdc\u3057\u305fWhisper\u3001\u65e5\u672c\u8a9e\u7279\u5316\u306eParakeet\u3068Haas\u3001Cohere Transcribe\uff08\u30aa\u30d7\u30b7\u30e7\u30f3\uff09\u304b\u3089\u7cbe\u5ea6\u3068\u901f\u5ea6\u306b\u5408\u308f\u305b\u3066\u9078\u3079\u307e\u3059\u3002" },
                    { icon: "fa-solid fa-plug", title: "\u30ed\u30fc\u30ab\u30eb\u6587\u5b57\u8d77\u3053\u3057API", text: "127.0.0.1\u3067\u52d5\u304fOpenAI\u4e92\u63dbAPI\uff08\u30ea\u30a2\u30eb\u30bf\u30a4\u30e0\u30b9\u30c8\u30ea\u30fc\u30df\u30f3\u30b0\u5bfe\u5fdc\uff09\u3067\u3001\u81ea\u4f5c\u306e\u30c4\u30fc\u30eb\u304b\u3089Echo\u306e\u30e2\u30c7\u30eb\u3092\u4f7f\u3048\u307e\u3059\uff08\u30aa\u30d7\u30b7\u30e7\u30f3\uff09\u3002" },
                ],
                requirements: [
                    "macOS 26.2 \u4ee5\u964d",
                    "Apple Silicon\uff08M1\u4ee5\u964d\uff09",
                    "16GB\u4ee5\u4e0a\u306eRAM\u63a8\u5968\uff0832GB\u4ee5\u4e0a\u3067\u306f\u5927\u304d\u3044\u4f1a\u8b70\u30e1\u30e2\u7528\u30e2\u30c7\u30eb\u3092\u4f7f\u7528\uff09",
                    "\u97f3\u58f0\u8a8d\u8b58\u306b2GB\u4ee5\u4e0a\u3001AI\u6a5f\u80fd\u306b\u3055\u3089\u306b5\u301c20GB\u306e\u7a7a\u304d\u5bb9\u91cf",
                ],
            },
        };

        // --- State ---
        let currentLang = "en";

        function detectLang() {
            const stored = localStorage.getItem("echo-lang");
            if (stored && i18n[stored]) return stored;
            const nav = navigator.language || navigator.userLanguage || "en";
            return nav.startsWith("ja") ? "ja" : "en";
        }

        function t(key) {
            return i18n[currentLang][key] || i18n.en[key] || key;
        }

        // --- Render ---
        function renderPage() {
            document.documentElement.lang = currentLang;
            document.title = currentLang === "ja"
                ? "Echo - Apple Silicon\u5bfe\u5fdc\u30aa\u30d5\u30e9\u30a4\u30f3\u97f3\u58f0\u5165\u529b"
                : "Echo - Offline Voice Input for Apple Silicon";

            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                el.textContent = t(key);
            });

            // Features
            const grid = document.getElementById("features-grid");
            grid.innerHTML = "";
            t("features").forEach(f => {
                const div = document.createElement("div");
                div.className = "feature";
                div.innerHTML = `
                    <div class="feature-icon"><i class="${f.icon}"></i></div>
                    <h3 class="feature-title">${f.title}</h3>
                    <p class="feature-text">${f.text}</p>`;
                grid.appendChild(div);
            });

            // Requirements
            const reqList = document.getElementById("requirements-list");
            reqList.innerHTML = "";
            t("requirements").forEach(r => {
                const div = document.createElement("div");
                div.className = "requirement";
                div.innerHTML = `<span class="requirement-icon"><i class="fa-solid fa-check"></i></span><span>${r}</span>`;
                reqList.appendChild(div);
            });

            // Language switch label
            document.getElementById("lang-label").textContent = t("lang.label");
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem("echo-lang", lang);
            renderPage();
        }

        // --- GitHub Releases ---
        async function loadLatestRelease() {
            try {
                const response = await fetch("https://api.github.com/repos/qluto/echo/releases/latest");
                if (!response.ok) throw new Error("Failed to fetch releases");
                const release = await response.json();

                const versionText = document.getElementById("version-text");
                versionText.textContent = t("version.latest").replace("{tag}", release.tag_name);
                versionText.setAttribute("data-tag", release.tag_name);

                const platformMap = {
                    "macos-apple-silicon": (name) => name.includes("aarch64") && name.endsWith(".dmg"),
                };

                release.assets.forEach(asset => {
                    const fileName = asset.name.toLowerCase();
                    Object.entries(platformMap).forEach(([btnId, matcher]) => {
                        if (matcher(fileName)) {
                            const btn = document.getElementById(btnId);
                            if (btn) {
                                btn.href = asset.browser_download_url;
                                btn.style.opacity = "1";
                                btn.style.pointerEvents = "auto";
                            }
                        }
                    });
                });
            } catch (error) {
                console.error("Error loading releases:", error);
                const versionText = document.getElementById("version-text");
                versionText.textContent = t("version.fallback");
            }
        }

        // Re-translate version badge when language switches
        function updateVersionBadge() {
            const versionText = document.getElementById("version-text");
            const tag = versionText.getAttribute("data-tag");
            if (tag) {
                versionText.textContent = t("version.latest").replace("{tag}", tag);
            }
        }

        // --- Init ---
        document.addEventListener("DOMContentLoaded", () => {
            currentLang = detectLang();
            renderPage();
            loadLatestRelease();

            const langSwitch = document.getElementById("lang-switch");
            langSwitch.addEventListener("click", () => {
                setLang(currentLang === "en" ? "ja" : "en");
                updateVersionBadge();
            });
            langSwitch.addEventListener("keydown", (e) => {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    langSwitch.click();
                }
            });
        });
    </script>
