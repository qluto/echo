name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    # Apple Silicon (required for MLX) with the macOS 26 SDK: the app targets
    # macOS 26.2 so that MLX compiles its M5 "NAX" kernels.
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ASR + post-processing run fully in-process (Rust/MLX + whisper.cpp);
      # there is no Python sidecar to build.

      # ===== Frontend & Tauri Build =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Update version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to: $VERSION"

          sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

          echo "Version updated to $VERSION"

      - name: Import Apple Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm $RUNNER_TEMP/certificate.p12

      # With an SDK older than 26.2, MLX only warns and silently builds
      # without its NAX kernels, so fail instead.
      - name: Select Xcode with the macOS 26.2+ SDK
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          echo "Using $XCODE (macOS SDK $SDK)"
          if [ "$(printf '%s\n' 26.2 "$SDK" | sort -V | head -1)" != "26.2" ]; then
            echo "::error::macOS SDK $SDK is older than 26.2"
            exit 1
          fi

      # mlx-rs (the in-process Cohere ASR engine) compiles MLX C++ + Metal
      # kernels from source. On Xcode 16+ the Metal compiler is a separately
      # installed component; download it idempotently (no-op on older Xcode).
      - name: Ensure Metal toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain 2>/dev/null \
            || echo "Metal toolchain already present or not required for this Xcode"
          xcrun metal --version 2>&1 || true

      # An app shipped without the public key can never check for updates.
      - name: Check the updater public key
        run: |
          node -e 'process.exit(require("./src-tauri/tauri.conf.json").plugins.updater.pubkey ? 0 : 1)' \
            || { echo "::error::No updater public key in tauri.conf.json; run scripts/setup-updater-key.sh"; exit 1; }

      # Also builds the signed update archive (Echo.app.tar.gz + .sig). Only
      # here: local builds stay possible without the signing key.
      - name: Build Tauri app
        run: npm run tauri:build -- --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # What installed copies read from releases/latest/download/latest.json.
      - name: Describe the update
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          node -e '
            const fs = require("fs");
            const [tag, sig, out] = process.argv.slice(1);
            fs.writeFileSync(out, JSON.stringify({
              version: tag.replace(/^v/, ""),
              pub_date: new Date().toISOString(),
              platforms: { "darwin-aarch64": {
                signature: fs.readFileSync(sig, "utf8"),
                url: `https://github.com/qluto/echo/releases/download/${tag}/Echo.app.tar.gz`,
              } },
            }, null, 2));
          ' "$GITHUB_REF_NAME" "$bundle/Echo.app.tar.gz.sig" "$bundle/latest.json"

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Echo.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/latest.json
          fail_on_unmatched_files: true
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
