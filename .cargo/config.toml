[build]
# src-tauri and rust-asr are separate workspaces; sharing one target dir keeps
# them from compiling MLX and whisper.cpp twice. Relative to the repo root.
target-dir = "src-tauri/target"

[env]
# MLX builds its M5 "NAX" kernels (~3x faster prefill) only when the deployment
# target is >= macOS 26.2; without this, plain `cargo build` targets the host OS
# and the app ships whatever the build machine happened to run. `tauri build`
# sets the same value from bundle.macOS.minimumSystemVersion.
MACOSX_DEPLOYMENT_TARGET = "26.2"
